services: 
  app: 
    build: . 
    container_name: semantic_app 
    ports: 
      - "8080:80" 
    volumes: 
      - .:/var/www/html 
    depends_on: 
      - fuseki 
      - solr 
 
  fuseki: 
    image: stain/jena-fuseki 
    container_name: fuseki 
    ports: 
      - "3030:3030" 
    volumes: 
      - fuseki_data:/fuseki 
 
  solr: 
    image: solr:9 
    container_name: solr 
    ports: 
      - "8983:8983" 
    command: 
      - solr-precreate 
      - sem_text_core 
    volumes: 
      - solr_data:/var/solr 
 
volumes: 
  fuseki_data: 
  solr_data: 
